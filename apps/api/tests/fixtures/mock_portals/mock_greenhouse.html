<!DOCTYPE html>
<html>
<head><title>Databricks Careers - AI Engineer</title></head>
<body>
<form id="application_form">
  <div class="field"><label for="first_name">First Name</label><input type="text" id="first_name" name="first_name"></div>
  <div class="field"><label for="last_name">Last Name</label><input type="text" id="last_name" name="last_name"></div>
  <div class="field"><label for="email">Email</label><input type="email" id="email" name="email"></div>
  <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="phone"></div>
  <div id="resume_fieldset"><input type="file" name="resume" accept=".pdf,.doc,.docx"></div>
  <div class="field"><label for="job_application_answers_attributes_0_boolean_value">LinkedIn</label><input type="text" id="job_application_answers_attributes_0_text_value" autocomplete="linkedin"></div>
  <div class="field"><label for="job_application_answers_attributes_1_text_value">Personal Website</label><input type="text" id="job_application_answers_attributes_1_text_value" autocomplete="website"></div>
  <div class="field"><label for="sponsorship">Will you now or in the future require visa sponsorship?</label><input type="text" id="job_application_answers_attributes_sponsorship"></div>
  <div class="field"><label for="essay">Why Databricks?</label><textarea id="job_application_answers_attributes_essay"></textarea></div>
  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body>
</html>
