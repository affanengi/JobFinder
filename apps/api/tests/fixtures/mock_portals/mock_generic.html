<!DOCTYPE html>
<html>
<head><title>Generic Portal</title></head>
<body>
<form>
  <input type="text" autocomplete="given-name" placeholder="Given name">
  <input type="text" autocomplete="family-name" placeholder="Family name">
  <input type="email" autocomplete="email">
  <input type="tel" autocomplete="tel">
  <input type="file" accept=".pdf">
  <textarea placeholder="Tell us about yourself"></textarea>
  <input type="submit" value="Send Application">
</form>
</body>
</html>
