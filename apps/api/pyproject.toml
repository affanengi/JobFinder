[project]
name = "job-finder-api"
version = "0.1.0"
description = "Personal AI Job Agent Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Affan Razvi" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "google-genai>=0.1.1",
    "firebase-admin>=6.6.0",
    "playwright>=1.49.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line length (handled by formatter)
    "E402",  # module level import not at top
    "E741",  # ambiguous variable name (e.g. l in comprehension)
    "E701",  # multiple statements on one line
    "F401",  # unused imports in test suites and exports
    "F841",  # unused local variables in test mocks
    "W291",  # trailing whitespace
    "W292",  # no newline at end of file
    "W293",  # blank line contains whitespace
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
